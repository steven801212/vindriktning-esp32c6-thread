[platformio]
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = espressif32 @ 6.12.0
board = seeed_xiao_esp32c6
framework = espidf

; Work around ESP-IDF 5.5 OpenThread timestamp quoting issue on PlatformIO/Windows
extra_scripts = pre:scripts/patch_openthread_datetime.py

monitor_speed = 115200
upload_speed = 460800

board_build.partitions = partitions.csv

; Phase 1 intentionally uses:
; - Native IEEE 802.15.4 / OpenThread
; - Full Thread Device (router-capable)
; - USB Serial/JTAG system console
; - No interactive OT USB CLI
; - No Wi-Fi
; - No Matter yet
; - No VINDRIKTNING/SHTC3 sensor code yet
